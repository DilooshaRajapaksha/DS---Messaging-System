<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DistMsg — Distributed Messaging System</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --border:    #21262d;
    --accent:    #58a6ff;
    --accent2:   #3fb950;
    --warn:      #f85149;
    --muted:     #8b949e;
    --text:      #e6edf3;
    --text-dim:  #c9d1d9;
    --bubble-me: #1f3a5f;
    --bubble-in: #1c2128;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  /* ── HEADER ─────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), #1f6feb);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  /* Server status pills */
  .servers {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .server-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .server-pill:hover { border-color: var(--accent); }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .dot.alive  { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  .dot.failed { background: var(--warn);    box-shadow: 0 0 6px var(--warn); }

  /* ── MAIN LAYOUT ────────────────────────── */
  main {
    display: grid;
    grid-template-columns: 280px 1fr;
    overflow: hidden;
  }

  /* ── SIDEBAR ────────────────────────────── */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .aside-title {
    padding: 16px 16px 10px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  /* Compose form */
  .compose {
    padding: 0 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }

  .compose input, .compose textarea, .compose select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 0.82rem;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
  }

  .compose input:focus,
  .compose textarea:focus,
  .compose select:focus {
    border-color: var(--accent);
  }

  .compose textarea { min-height: 72px; }

  .compose select option { background: var(--surface); }

  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }

  .btn-send {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-family: 'Sora', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    width: 100%;
  }
  .btn-send:hover   { opacity: 0.85; }
  .btn-send:active  { transform: scale(0.98); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Recipient filter */
  .filter-box {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .filter-box label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .filter-row { display: flex; gap: 6px; }

  .filter-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 0.82rem;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .filter-row input:focus { border-color: var(--accent); }

  .btn-filter {
    background: var(--border);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-filter:hover { background: #2d333b; }

  /* Server selector for reads */
  .server-select-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .srv-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .srv-btn.active, .srv-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Log panel */
  .log-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }

  .log-entry {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    padding: 3px 0;
    border-bottom: 1px solid #1c2128;
    line-height: 1.5;
    word-break: break-all;
  }

  .log-entry.ok   { color: var(--accent2); }
  .log-entry.err  { color: var(--warn); }
  .log-entry.info { color: var(--accent); }

  /* ── CHAT AREA ───────────────────────────── */
  .chat-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-toolbar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--muted);
    background: var(--surface);
  }

  .chat-toolbar span { font-family: 'JetBrains Mono', monospace; }

  .btn-refresh {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 5px 12px;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    transition: all 0.2s;
  }
  .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

  .messages-list {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
  }

  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 0.85rem; line-height: 1.6; }

  /* Message bubbles */
  .msg-bubble {
    max-width: 72%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-bubble.outgoing { align-self: flex-end; align-items: flex-end; }
  .msg-bubble.incoming { align-self: flex-start; align-items: flex-start; }

  .msg-meta {
    font-size: 0.68rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .msg-body {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.5;
    word-break: break-word;
  }

  .outgoing .msg-body {
    background: var(--bubble-me);
    border-bottom-right-radius: 3px;
    color: var(--text);
  }

  .incoming .msg-body {
    background: var(--bubble-in);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
    color: var(--text);
  }

  .msg-footer {
    font-size: 0.65rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    gap: 6px;
  }

  .replicated-badge {
    background: #1a3a2a;
    color: var(--accent2);
    border: 1px solid #2d6a4f33;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.62rem;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 0.82rem;
    max-width: 320px;
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.3s;
    z-index: 100;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.ok   { border-color: var(--accent2); color: var(--accent2); }
  #toast.err  { border-color: var(--warn);    color: var(--warn); }
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────── -->
<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    DistMsg
    <span style="font-size:0.7rem;color:var(--muted);font-weight:400;font-family:'JetBrains Mono',monospace;">distributed messaging</span>
  </div>
  <div class="servers" id="serverPills">
    <div class="server-pill" onclick="checkHealth('server1','http://127.0.0.1:8001')">
      <span class="dot" id="dot-server1"></span> server1 :8001
    </div>
    <div class="server-pill" onclick="checkHealth('server2','http://127.0.0.1:8002')">
      <span class="dot" id="dot-server2"></span> server2 :8002
    </div>
    <div class="server-pill" onclick="checkHealth('server3','http://127.0.0.1:8003')">
      <span class="dot" id="dot-server3"></span> server3 :8003
    </div>
  </div>
</header>

<!-- ── MAIN ────────────────────────────────────────── -->
<main>

  <!-- SIDEBAR -->
  <aside>
    <div class="aside-title">Send Message</div>

    <div class="compose">
      <div class="row">
        <input id="fromInput"  placeholder="From (sender)" />
        <input id="toInput"    placeholder="To (recipient)" />
      </div>
      <textarea id="msgInput" placeholder="Type your message..."></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">
        Send via Server1 (Primary)
      </button>
    </div>

    <div class="filter-box">
      <label>Read Messages</label>
      <div class="server-select-row" id="readServerBtns">
        <button class="srv-btn active" data-url="http://127.0.0.1:8001" onclick="selectReadServer(this)">server1</button>
        <button class="srv-btn"        data-url="http://127.0.0.1:8002" onclick="selectReadServer(this)">server2</button>
        <button class="srv-btn"        data-url="http://127.0.0.1:8003" onclick="selectReadServer(this)">server3</button>
      </div>
      <div class="filter-row">
        <input id="recipientFilter" placeholder="Recipient name..." />
        <button class="btn-filter" onclick="fetchMessages()">Fetch</button>
      </div>
    </div>

    <div class="aside-title" style="padding-top:12px;">Activity Log</div>
    <div class="log-area" id="logArea"></div>
  </aside>

  <!-- CHAT -->
  <div class="chat-area">
    <div class="chat-toolbar">
      <span id="chatLabel">Messages</span>
      <button class="btn-refresh" onclick="fetchMessages()">↻ Refresh</button>
    </div>
    <div class="messages-list" id="messagesList">
      <div class="empty-state">
        <div class="icon">💬</div>
        <p>No messages yet.<br>Send one or fetch messages<br>for a recipient.</p>
      </div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────
const PRIMARY    = 'http://127.0.0.1:8001';
let   readServer = 'http://127.0.0.1:8001';
let   currentRecipient = '';
const SEND_TIMEOUT_MS = 15000;
const FETCH_TIMEOUT_MS = 8000;

// ── Utility ─────────────────────────────────────────
function log(msg, type = '') {
  const area = document.getElementById('logArea');
  const el   = document.createElement('div');
  el.className = `log-entry ${type}`;
  const ts = new Date().toLocaleTimeString('en-US', { hour12: false });
  el.textContent = `[${ts}] ${msg}`;
  area.prepend(el);
  // keep last 60 entries
  while (area.children.length > 60) area.removeChild(area.lastChild);
}

function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = `show ${type}`;
  setTimeout(() => { t.className = ''; }, 3000);
}

function formatTs(ts) {
  if (!ts) return '';
  return new Date(ts * 1000).toLocaleTimeString('en-US', { hour12: false, hour:'2-digit', minute:'2-digit' });
}

// ── Server Health ────────────────────────────────────
async function checkHealth(name, url) {
  const dot = document.getElementById(`dot-${name}`);
  try {
    const r = await fetch(`${url}/heartbeat`, { signal: AbortSignal.timeout(2000) });
    const d = await r.json();
    dot.className = d.status === 'alive' ? 'dot alive' : 'dot failed';
    log(`💓 ${name}: ${d.status}`, d.status === 'alive' ? 'ok' : 'err');
  } catch {
    dot.className = 'dot failed';
    log(`💔 ${name}: unreachable`, 'err');
  }
}

function checkAllHealth() {
  checkHealth('server1', 'http://127.0.0.1:8001');
  checkHealth('server2', 'http://127.0.0.1:8002');
  checkHealth('server3', 'http://127.0.0.1:8003');
}

// ── Read Server Selection ────────────────────────────
function selectReadServer(btn) {
  document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  readServer = btn.dataset.url;
  log(`📡 Reading from ${btn.textContent}`, 'info');
  if (currentRecipient) fetchMessages();
}

// ── Send Message ─────────────────────────────────────
async function sendMessage() {
  const sender    = document.getElementById('fromInput').value.trim();
  const recipient = document.getElementById('toInput').value.trim();
  const content   = document.getElementById('msgInput').value.trim();

  if (!sender || !recipient || !content) {
    toast('Fill in From, To and Message fields!', 'err');
    return;
  }

  const btn = document.getElementById('sendBtn');
  btn.disabled    = true;
  btn.textContent = 'Sending...';

  log(`📤 Sending: "${content}" from ${sender} → ${recipient}`, 'info');

  try {
    const r = await fetch(`${PRIMARY}/send`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ sender, recipient, content }),
      signal:  AbortSignal.timeout(SEND_TIMEOUT_MS)
    });

    const d = await r.json();

    if (r.ok && d.success) {
      log(`✅ Sent! ID: ${d.message_id?.slice(0,8)}... | Confirmations: ${d.confirmations}/3`, 'ok');
      log(`   Replicated to: ${d.replicated_to?.join(', ')}`, 'ok');
      toast(`✅ Message sent! Replicated to ${d.confirmations} servers`, 'ok');
      document.getElementById('msgInput').value = '';

      // Always show the latest sent conversation immediately.
      document.getElementById('recipientFilter').value = recipient;
      currentRecipient = recipient;
      await fetchMessages({ recipient, serverUrl: PRIMARY, serverName: 'server1' });
      checkAllHealth();
    } else {
      const err = d.detail?.error || JSON.stringify(d.detail) || 'Unknown error';
      log(`❌ Failed: ${err}`, 'err');
      toast(`❌ ${err}`, 'err');
    }
  } catch (e) {
    log(`❌ Network error: ${e.message}`, 'err');
    toast('❌ Cannot reach Server1 — is it running?', 'err');
  }

  btn.disabled    = false;
  btn.textContent = 'Send via Server1 (Primary)';
}

// ── Fetch Messages ────────────────────────────────────
async function fetchMessages(options = {}) {
  const recipient = (options.recipient ?? document.getElementById('recipientFilter').value).trim();
  if (!recipient) {
    toast('Enter a recipient name to fetch messages', 'err');
    return;
  }

  currentRecipient = recipient;
  const serverUrl  = options.serverUrl || readServer;
  const serverName = options.serverName || document.querySelector('.srv-btn.active')?.textContent || 'server1';
  document.getElementById('chatLabel').textContent = `Messages for "${recipient}" — via ${serverName}`;
  log(`📥 Fetching messages for "${recipient}" from ${serverName}...`, 'info');

  try {
    const r = await fetch(
      `${serverUrl}/messages?recipient=${encodeURIComponent(recipient)}`,
      { signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) }
    );
    if (!r.ok) {
      throw new Error(`HTTP ${r.status}`);
    }
    const d = await r.json();
    renderMessages(d.messages || [], recipient);
    log(`✅ Got ${d.count} message(s) for "${recipient}"`, 'ok');
  } catch (e) {
    log(`❌ Fetch error: ${e.message}`, 'err');
    toast('❌ Cannot reach server — is it running?', 'err');
  }
}

// ── Render Messages ───────────────────────────────────
function renderMessages(messages, recipient) {
  const list = document.getElementById('messagesList');

  if (!messages.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>No messages found<br>for "<strong>${recipient}</strong>"</p>
      </div>`;
    return;
  }

  list.innerHTML = '';

  messages.forEach(msg => {
    const isOut  = msg.sender?.toLowerCase() === recipient?.toLowerCase();
    const bubble = document.createElement('div');
    bubble.className = `msg-bubble ${isOut ? 'outgoing' : 'incoming'}`;

    const repStatus = msg.replication_status || '';
    const repBadge  = repStatus === 'replicated'
      ? `<span class="replicated-badge">✓ replicated</span>`
      : `<span class="replicated-badge" style="color:var(--muted);background:#1c2128;">⏳ ${repStatus}</span>`;

    bubble.innerHTML = `
      <div class="msg-meta">
        <strong style="color:var(--text-dim)">${msg.sender}</strong>
        <span>→</span>
        <span>${msg.recipient}</span>
      </div>
      <div class="msg-body">${escapeHtml(msg.content)}</div>
      <div class="msg-footer">
        <span>${formatTs(msg.timestamp)}</span>
        ${repBadge}
        <span style="color:#444">${msg.message_id?.slice(0,8)}...</span>
      </div>`;

    list.appendChild(bubble);
  });

  // scroll to bottom
  list.scrollTop = list.scrollHeight;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// ── Enter key shortcuts ───────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('recipientFilter').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchMessages();
  });
  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // initial health check
  checkAllHealth();
  log('🚀 DistMsg UI loaded', 'info');
  log('💡 Make sure all 3 servers are running!', 'info');
});

// ── Auto health check every 10s ───────────────────────
setInterval(checkAllHealth, 10000);
</script>
</body>
</html>
